# The storyboard. Adding a page = adding an entry here; no code changes.
#
# Placeholders, filled per book: {hero} (the reader's own name in the story text; Jack/Jane in image prompts), {he} {his} {him} and capitalized {He} {His}.
# cast:  character keys from `characters` (plus `hero`). Only their sheets are sent with the page,
#        and the prompt says no one else appears.
# text_zone: where the story text is drawn on the art: bottom | top | bottom-dark.

title: Jack and the Beanstalk
style: animated3d
theme: jack   # the website's look: static/themes/jack/
blurb: You trade the family cow for five magic beans. By morning, nothing will ever be the same.
library_cover: /static/themes/jack/art/cover.webp   # the library's cover (the site sets the title on it)
# The story page's look. Jack has its own theme folder (static/themes/jack/: colours and drifting clouds), so only
# the art painted by `python -m scripts.make_theme_art jack_and_the_beanstalk` is described here.
look:
  backdrop:
    wide: >-
      A wide, cheerful storybook landscape for a children's website background. A bright soft daytime sky with a
      few fluffy clouds. Rolling bright green hills along the bottom with wildflowers. A small cosy thatched
      cottage with a red door on the lower left. A giant magic beanstalk curls up the far left edge into the
      clouds. A tiny fairy-tale castle sits on a cloud at the top right. Keep the whole centre of the picture as
      calm open sky with nothing in it, for text and cards to sit on.
    tall: >-
      A tall, cheerful storybook landscape for a phone background. A bright soft daytime sky with a few fluffy
      clouds. Rolling bright green hills along the bottom with wildflowers and a small cosy thatched cottage. A
      giant magic beanstalk curls up the left edge into the clouds, a tiny fairy-tale castle on a cloud at the
      top. Keep the middle as calm open sky with nothing in it.
  art:
    - {name: cloud, transparent: true, prompt: "One big, soft, fluffy white storybook cloud, round and friendly. Nothing else."}
    - name: beans
      transparent: true
      prompt: >-
        Five plump magic beans in a little pile: one deep red, one purple, one cream with red speckles, one green,
        one mottled brown, each with a faint golden magical glow and a few tiny sparkles. Nothing else.
    - {name: icon-camera, transparent: true, prompt: "A cute, chunky toy camera icon, rounded, cream and leaf-green. Nothing else."}
    - {name: icon-key, transparent: true, prompt: "A cute golden storybook key with a little leaf on its bow, rounded and chunky. Nothing else."}
    - name: icon-book
      transparent: true
      prompt: A cute open storybook icon with a tiny beanstalk sprouting from its pages, rounded and chunky. Nothing else.

# The library's cover picture (drawn once by `python -m scripts.make_cover <story>`; the site sets the title on it).
cover:
  scene: >-
    High on the beanstalk, among huge leaves. Jack, a storybook boy of about ten with messy brown hair and
    freckles, climbs, gripping the stalk, boots on a curling tendril, and looks back over his shoulder with an
    excited, brave smile. Far below, the cottage, the garden and the village are tiny. Small birds fly past at
    his level.
  mood: Brave and dizzying, a little exciting. Clear morning light the higher he goes, soft mist far below.
  composition: >-
    Jack large and close, near the middle. The top quarter is soft, plain pale sky and cloud with nothing in it,
    for a title added later. Only Jack appears. No other people.
cover_page: 5   # each book's cover on the bookshelf is this page, cropped upright around the hero

# The story page's own words. Everything on the site that belongs to this story lives here.
site:
  heading: [Jack, and the, Beanstalk]   # the big title; the middle part is set small
  go: Plant the magic beans              # the button that starts a book
  going: Planting the beans…             # the button while the book is being sent
  growing: Growing your book             # the progress card's title
  # While the book is drawn, the progress card's title changes every few seconds to one of these little jobs
  # from the story, just something fun to read while waiting.
  musing: [Watering the magic beans, Milking Milky-White, Polishing the golden eggs, Tuning the golden harp,
           Tiptoeing past the giant, Counting the gold coins, Climbing above the clouds, Feeding the golden hen,
           Sharpening the axe, Hiding in the oven, Patching the old trousers, Sweeping the cottage floor]
  binding: Binding your book…            # once every picture is drawn
  failed: Oh no, the beans didn’t grow   # when a book can't be finished
  hero_progress: Planting the beans…     # while your cartoon is drawn
  about_placeholder: Wants to climb a real beanstalk one day
  review_placeholder: The beans on page 3 look strange…
  pdf_name: JackAndTheBeanstalk.pdf

world: >-
  a fairy tale about a very poor family in a hard year. Crooked cottages, twisted trees, slightly
  exaggerated storybook shapes. Everything old, worn, dusty and patched; muted earthy colours;
  nothing new, clean or polished.

# The form's two buttons. Each sets he/she in the story text and the hero's name in the pictures.
pronouns:
  question: Jack or Jane?
  boy: Jack
  girl: Jane

hero:
  names: {boy: Jack, girl: Jane}
  outfit: oatmeal linen tunic, brown vest, patched brown trousers, worn leather boots

# Each character's picture is drawn once from this description and kept in the database (stories/README.md).
characters:
  mother:
    name: "{hero}'s mother"
    description: >-
      a thin, tired woman in her late thirties, worry lines, brown hair under a faded beige
      headscarf, patched oatmeal blouse, brown skirt, faded patched apron
  milky_white:
    name: Milky-White, the cow
    description: >-
      a bony, gentle old black-and-white cow with a sad, kind face, small horns and a frayed
      rope halter
  old_man:
    name: the strange old man
    description: >-
      a slightly stooped, mysterious elderly man with ordinary, natural features and a straight,
      ordinary nose (never a caricature), a short grey beard, a quiet knowing smile, a ragged
      patched long coat and a battered flat cap
  giant:
    name: the giant
    description: >-
      an enormous, shaggy giant, as tall as a house, with a wild brown beard, bushy eyebrows, a
      big round belly in a rough patched leather jerkin, coarse wool trousers and huge bare feet;
      gruff and frightening in a storybook way, never gory
  golden_hen:
    name: the golden hen
    description: >-
      a plump little brown hen with feathers that shimmer gold at the tips, bright clever eyes and
      a small red comb
  golden_harp:
    name: the golden harp
    description: >-
      an object, not a person: a small golden harp standing on its own with nobody holding it,
      about the size of a child's arm, its frame carved at the top with a small gentle face,
      shining strings, slightly worn and very old

pages:
  - type: illustrated
    progress: "Checking the empty cupboard…"   # shown while this picture is being drawn
    text: "{hero} and {his} mother had nothing left to sell but Milky-White."
    cast: [hero, mother, milky_white]
    scene: >-
      A bare, poor cottage kitchen in a hard winter. The cupboard doors hang open on empty, dusty
      shelves; a cracked empty bowl sits on a rough table. {hero}'s mother stands by the empty
      cupboard, worried. {hero}, thin and serious, is shown full face, front-lit by cold daylight
      from the door, looking at {his} mother with a sad, worried expression. Through the open door
      behind them, Milky-White stands in a muddy yard.
    mood: >-
      Quiet, sad and hungry. Cold, overcast grey daylight, deep shadows in the corners; no golden
      sunshine.
    composition: >-
      Characters in the upper two-thirds. The lower third is the worn, uneven earth floor in soft
      shadow, plain and low in detail, for text added later. Not a table edge, board or blank panel.
    text_zone: bottom
    focus: Milky-White the cow

  - type: illustrated
    progress: "Swapping the cow for beans…"   # shown while this picture is being drawn
    text: "“Five magic beans,” said the old man. “For one cow.”"
    cast: [hero, old_man, milky_white]
    scene: >-
      A muddy dirt road under a grey, overcast sky, bare hedgerows and twisted trees, a village tiny
      in the far distance. The strange old man holds out his open palm with exactly five beans: one
      deep red, one purple, one cream with red speckles, one green, one mottled brown; real dried
      beans, each with a faint magical glow, not candy, not jelly beans. {hero}, in three-quarter
      view and in the same clothes as before, holds a frayed rope tied to Milky-White and stares at
      the beans: unsure, tempted, hungry. Milky-White looks tired.
    mood: >-
      Uncertain and a little eerie; the old man's smile is knowing, not jolly. Flat, cool overcast
      light; muted colours.
    composition: >-
      Characters in the lower two-thirds. The top third is plain, soft overcast sky with no birds or
      detail, for text added later.
    text_zone: top
    focus: the five beans in the old man's hand

  - type: illustrated
    progress: "Throwing the beans out the window…"   # shown while this picture is being drawn
    text: "“Beans!” she cried. And out the window they went."
    cast: [hero, mother]
    scene: >-
      The cottage at dusk, seen from the garden. {hero}'s mother leans out of the window, angrily
      throwing the beans. Exactly five beans scatter through the air into the garden below: one deep
      red, one purple, one cream with red speckles, one green, one mottled brown; real dried beans,
      faintly glowing, not candy. {hero} stands alone in the open doorway, watching, worried.
    mood: >-
      Darker than the daytime pages: deep blue dusk, warm lamplight in the window.
    composition: >-
      Keep the bottom quarter as plain, dark grass with no detail, for text added later.
    text_zone: bottom-dark
    focus: the beans flying from the window

  - type: illustrated
    progress: "Waiting for the beans to sprout…"   # shown while this picture is being drawn
    text: "In the morning, a beanstalk stood where the beans had fallen, reaching up into the clouds."
    cast: [hero]
    scene: >-
      Early morning in the cottage garden. A colossal, twisting green beanstalk, thick as an old
      tree, rises from the garden soil, coiling up and up until it disappears into low clouds.
      {hero} stands at its foot in the same clothes, head tilted all the way back, mouth open in
      wonder, one hand on the enormous stalk.
    mood: >-
      Wonder and a first touch of hope. Cool pale dawn light, mist on the ground, a soft glow
      where the stalk meets the clouds.
    composition: >-
      Tall, upward-looking view with the stalk filling the middle. The top third is soft, plain
      cloud and pale sky for text added later.
    text_zone: top

  - type: illustrated
    progress: "Climbing past the birds…"   # shown while this picture is being drawn
    text: "Up and up {hero} climbed, past the birds and into the clouds."
    cast: [hero]
    scene: >-
      High on the beanstalk, among huge leaves. {hero} climbs, gripping the stalk with both hands,
      boots on a curling tendril, looking up with determination. Far below, the cottage, the garden
      and the village are tiny. Small birds fly past at {his} level.
    mood: >-
      Brave and dizzying, a little exciting. Brighter, clearer morning light the higher {he} goes.
    composition: >-
      {hero} near the middle of the picture, side to side, with {his} face clearly visible; {hero} and the stalk in the upper two-thirds. The lower third is soft white mist and cloud,
      plain and low in detail, for text added later.
    text_zone: bottom

  - type: illustrated
    progress: "Knocking on a very big door…"   # shown while this picture is being drawn
    text: "Above the clouds stood a castle so big its door could have swallowed the cottage. {He} crept inside."
    cast: [hero]
    scene: >-
      On top of the clouds, a road of packed cloud leads to an ancient, enormous grey stone castle,
      mossy and weathered, with a door many times taller than a house, standing slightly open.
      {hero}, tiny beside it, tiptoes toward the gap in the door, glancing back over {his} shoulder.
    mood: >-
      Hushed and a little scary. Soft golden afternoon light above the clouds, long shadows from
      the castle.
    composition: >-
      The castle fills the upper part of the picture. The lower third is smooth, plain cloud
      ground, low in detail, for text added later.
    text_zone: bottom
    focus: the castle door

  - type: illustrated
    progress: "Hiding in the oven…"   # shown while this picture is being drawn
    text: "“Fee-fi-fo-fum!” thundered the giant. {hero} hid in the oven, shaking."
    cast: [hero, giant]
    scene: >-
      A vast, shadowy castle kitchen with a hearth as big as a room. The giant stomps in through a
      huge doorway, sniffing the air, eyes narrowed. In the foreground, {hero} peeks out from inside
      the open door of a giant iron oven, eyes wide with fear, a hand over {his} mouth.
    mood: >-
      Tense and scary in a storybook way. Warm firelight from the hearth against deep shadows.
    composition: >-
      The giant and the oven in the lower two-thirds. The top third is the dark, plain stone
      ceiling in shadow, low in detail, for text added later.
    text_zone: top

  - type: illustrated
    progress: "Counting the giant’s gold…"   # shown while this picture is being drawn
    text: "The giant counted his gold, coin by coin, until his head drooped and he began to snore."
    cast: [hero, giant]
    scene: >-
      The giant sits at an enormous wooden table, a heap of gold coins and open money bags in front
      of him, his head nodding onto his folded arms, fast asleep. Across the room, {hero} watches
      from the oven door, holding very still.
    mood: >-
      Quiet and drowsy, holding its breath. Warm candlelight glinting on the gold.
    composition: >-
      The table and the sleeping giant in the upper two-thirds. The lower third is the plain, dim
      stone floor, low in detail, for text added later.
    text_zone: bottom
    focus: the heap of gold coins

  - type: illustrated
    progress: "Tiptoeing off with the gold…"   # shown while this picture is being drawn
    text: "Quiet as a mouse, {hero} crept out and grabbed a bag of gold."
    cast: [hero, giant]
    scene: >-
      Close to the table, the giant still snoring in the background, his huge hand resting near the
      coins. {hero} tiptoes away hugging a heavy bag of gold almost as big as {his} chest, a few
      coins spilling, glancing nervously back at the giant.
    mood: >-
      Sneaky and breathless. Warm candlelight, gold glints, deep shadows.
    composition: >-
      {hero} and the giant in the upper two-thirds. The lower third is the plain stone floor in
      shadow, low in detail, for text added later.
    text_zone: bottom
    focus: the bag of gold

  - type: illustrated
    progress: "Running all the way home…"   # shown while this picture is being drawn
    text: "Down the beanstalk {he} climbed and ran all the way home. {His} mother wept for joy."
    cast: [hero, mother]
    scene: >-
      The cottage doorway. {hero}'s mother kneels and hugs {hero} tightly, tears of happiness on her
      face; the open bag of gold sits at their feet, coins spilling onto the doorstep. The beanstalk
      rises behind the cottage.
    mood: >-
      Joy and relief. The first warm sunshine in the book, soft and golden.
    composition: >-
      The two of them in the upper two-thirds. The lower third is the plain worn doorstep and
      earth, low in detail, for text added later.
    text_zone: bottom
    focus: the bag of gold and the spilled coins

  - type: illustrated
    progress: "Spending the very last coin…"   # shown while this picture is being drawn
    text: "But gold does not last forever. When the last coin was spent, {hero} climbed the beanstalk again."
    cast: [hero, mother]
    scene: >-
      The cottage kitchen again, the cupboard nearly bare. {hero}'s mother holds up an empty, limp
      money bag, worried. {hero} stands at the open door, looking out toward the beanstalk with
      quiet resolve, one hand on the door frame.
    mood: >-
      Back to hard times, but braver now. Cool grey daylight through the door.
    composition: >-
      Characters in the upper two-thirds. The lower third is the plain worn earth floor in soft
      shadow, low in detail, for text added later.
    text_zone: bottom
    focus: the empty money bag

  - type: illustrated
    progress: "Stealing the golden hen…"   # shown while this picture is being drawn
    text: "“Lay!” said the giant, and his hen laid an egg of solid gold. When he dozed, {hero} snatched the hen and ran."
    cast: [hero, giant, golden_hen]
    scene: >-
      The giant's table. A single shining golden egg lies on the table; the giant slumps asleep in his
      huge chair. {hero} is mid-run toward the door with the golden hen tucked safely under one arm,
      looking back. There is only one hen in the picture: the one under {hero}'s arm.
    mood: >-
      Daring and quick. Warm candlelight, the golden egg glowing.
    composition: >-
      The scene in the lower two-thirds. The top third is the plain, dark stone wall in shadow,
      low in detail, for text added later.
    text_zone: top
    focus: the golden hen and the golden egg

  - type: illustrated
    progress: "Collecting golden eggs…"   # shown while this picture is being drawn
    text: "Now there was a golden egg every day. Still, {hero} kept wondering what else the giant kept up there."
    cast: [hero, mother, golden_hen]
    scene: >-
      The cottage, now mended and cosy, with a full basket on the table. {hero}'s mother smiles,
      holding up a golden egg. The golden hen sits in a straw nest on the table. {hero} stands at
      the window, gazing up at the beanstalk disappearing into the clouds, thoughtful and curious.
    mood: >-
      Comfortable and happy, with a pull of curiosity. Warm afternoon sunlight.
    composition: >-
      Characters in the upper two-thirds. The lower third is the plain wooden floor in soft
      shadow, low in detail, for text added later.
    text_zone: bottom
    focus: the golden egg and the golden hen

  - type: illustrated
    progress: "Peeking at the singing harp…"   # shown while this picture is being drawn
    text: "So {hero} climbed up once more. From behind the giant's chair, {he} eyed the golden harp that sang the giant to sleep."
    cast: [hero, giant, golden_harp]
    scene: >-
      The giant's hall at night. The golden harp stands on the giant's table, playing all by itself,
      soft glowing notes drifting from its strings; its carved face is calm, eyes half closed, as
      if singing. The giant slumps in his huge chair, eyelids drooping, nodding off. {hero} peeks
      out from behind one enormous chair leg, eyes fixed on the harp, wide with wonder.
    mood: >-
      Hushed, magical and sleepy. Low warm candlelight, a soft golden glow from the harp.
    composition: >-
      The scene in the lower two-thirds. The top third is the plain, dark stone ceiling in shadow,
      low in detail, for text added later.
    text_zone: top
    focus: the golden harp

  - type: illustrated
    progress: "Grabbing the harp…"   # shown while this picture is being drawn
    text: "{hero} grabbed the harp, and it cried out, “Master! Master!”"
    cast: [hero, giant, golden_harp]
    scene: >-
      The same hall. {hero} has just lifted the golden harp from the table and holds it in both
      arms; the carved face on the harp has its mouth wide open, crying out. {hero} stares at the
      harp in shock. Behind {him}, the giant is asleep in his chair, but one huge eye is starting
      to open.
    mood: >-
      The moment it all goes wrong: startled and alarming. Low candlelight, the harp gleaming.
    composition: >-
      The scene in the lower two-thirds. The top third is the plain, dark stone ceiling in shadow,
      low in detail, for text added later.
    text_zone: top
    focus: the golden harp

  - type: illustrated
    progress: "Outrunning a giant…"   # shown while this picture is being drawn
    text: "The giant woke with a roar and thundered after {him} across the clouds."
    cast: [hero, giant, golden_harp]
    scene: >-
      Outside the castle, on the road of clouds. {hero} runs toward the top of the beanstalk,
      clutching the harp. Behind {him}, the giant charges out of the castle door, arms reaching,
      shouting, his huge footsteps sending up puffs of cloud.
    mood: >-
      A thrilling chase. Dramatic stormy light, the sky turning dark behind the giant.
    composition: >-
      The chase in the upper two-thirds. The lower third is smooth, plain cloud ground, low in
      detail, for text added later.
    text_zone: bottom
    focus: the golden harp

  - type: illustrated
    progress: "Scrambling down the beanstalk…"   # shown while this picture is being drawn
    text: "Down the beanstalk {hero} scrambled, and the whole stalk shook as the giant climbed after {him}."
    cast: [hero, giant, golden_harp]
    scene: >-
      The beanstalk seen from below. {hero} climbs down fast with the harp slung on {his} back.
      High above, the giant climbs down after {him}, the stalk bending and swaying, leaves flying.
      The cottage roof is close below.
    mood: >-
      Urgent and dizzying. Grey windy light, leaves whipping past.
    composition: >-
      {hero} and the giant in the lower two-thirds. The top third is plain, soft grey cloud for
      text added later.
    text_zone: top
    focus: the golden harp

  - type: illustrated
    progress: "Shouting for the axe…"   # shown while this picture is being drawn
    text: "“Mother, the axe!” {hero} shouted."
    cast: [hero, mother]
    scene: >-
      The cottage garden at the foot of the beanstalk. {hero} jumps the last few feet to the
      ground, calling out. {hero}'s mother runs from the cottage holding out a woodcutter's axe.
      The beanstalk shakes violently above them.
    mood: >-
      Urgent and determined. Windy grey light, leaves falling.
    composition: >-
      Characters in the upper two-thirds. The lower third is the plain garden grass, low in
      detail, for text added later.
    text_zone: bottom
    focus: the axe

  - type: illustrated
    progress: "Chop! Chop! Chop!…"   # shown while this picture is being drawn
    text: "Chop! Chop! The beanstalk cracked and came crashing down, and the giant tumbled far away, never to be seen again."
    cast: [hero, mother, giant]
    scene: >-
      {hero} swings the axe into the base of the beanstalk, which is snapping and toppling. Far up
      in the sky, the giant tumbles away into the clouds, small and distant, arms flailing, like a
      falling leaf; nothing violent or hurt is shown. {hero}'s mother watches, hands at her mouth.
    mood: >-
      The big climax, then relief. The clouds breaking and a burst of sunlight coming through.
    composition: >-
      The action in the lower two-thirds. The top third is plain, bright sky breaking through
      the clouds, for text added later.
    text_zone: top
    focus: the axe biting into the beanstalk

  - type: illustrated
    progress: "Living happily ever after…"   # shown while this picture is being drawn
    text: "And {hero} and {his} mother lived happily ever after, with a golden hen, a singing harp, and never an empty cupboard again."
    cast: [hero, mother, golden_hen, golden_harp]
    scene: >-
      The cottage, now mended, with flowers by the door and a full cupboard. {hero} and {his}
      mother sit together by a warm fire, smiling. The golden hen sits in her nest, and the golden
      harp plays on a shelf. Milky-White's old halter hangs on a peg by the door.
    mood: >-
      Warm, safe and happy. Golden evening firelight, the brightest and cosiest page in the book.
    composition: >-
      Characters in the upper two-thirds. The lower third is the plain wooden floor and rug in
      soft shadow, low in detail, for text added later.
    text_zone: bottom
    focus: the golden hen and the golden harp

  - type: about_me
