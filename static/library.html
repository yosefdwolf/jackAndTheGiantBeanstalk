<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbefd6">
<title>{{TITLE}}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 30C16 20 10 18 10 12s4-9 6-10c2 1 6 4 6 10s-6 8-6 18z' fill='%233d8a2a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;800&family=Shantell+Sans:wght@400;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
<!--THEME_CSS-->
<style>
  .lead { text-align: center; font-size: 19px; margin: 6px auto 0; max-width: 34em; }
  .stories { list-style: none; margin: 0; padding: 0; display: grid; gap: 18px; }
  .story-card a { display: grid; grid-template-columns: 200px 1fr; gap: 0; text-decoration: none; color: var(--ink);
    background: var(--card); border: 3px solid var(--card-edge); border-radius: 22px; overflow: hidden;
    box-shadow: 0 6px 0 var(--card-edge); transition: transform .15s ease; }
  .story-card a:hover { transform: translateY(-2px); }
  .story-card a:focus-visible { outline: 3px solid var(--accent-deep); outline-offset: 3px; }
  .story-card img { width: 100%; height: 100%; min-height: 240px; object-fit: cover; display: block; }
  .story-info { display: grid; align-content: start; gap: 10px; padding: 20px 22px; }
  .story-info b { font: 800 30px/1.1 var(--display); color: var(--leaf-deep); }
  .story-info .blurb { font-size: 17px; }
  .story-info .meta { font: 600 15px var(--hand); color: var(--ink-soft); }
  .story-info .btn { justify-self: start; margin-top: 4px; }
  .soon { text-align: center; font-size: 16px; color: var(--ink-soft); }
  @media (max-width: 560px) {
    .story-card a { grid-template-columns: 1fr; }
    .story-card img { min-height: 0; aspect-ratio: 4 / 3; }
  }
  @media (prefers-reduced-motion: reduce) { .story-card a { transition: none; } }
</style>
</head>
<body class="library">
<!--SCENE-->
<main class="stand">
<!--NAV-->
  <header class="masthead">
    <p class="hand kicker">picture books starring you</p>
    <h1>The Library</h1>
    <p class="lead">Pick a story and add a photo. We’ll draw you as the hero on every page, then you can flip through it here or download the PDF.</p>
  </header>

  <ul class="stories" aria-label="Stories you can make">
    <!--STORIES-->
  </ul>
  <p class="soon hand">More stories are on the way.</p>

</main>

<script>
(() => {
  // A crowd study links to the front page with ?pid=…; carry it into the story so the review keeps it.
  if (location.search) {
    for (const a of document.querySelectorAll('.story-card a')) a.href += location.search;
  }
})();
</script>
</body>
</html>
